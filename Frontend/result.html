<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Rights Viewer</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .content-area {
      flex: 1; padding: 36px 32px;
      max-width: 900px; width: 100%; margin: 0 auto;
    }

    /* ── Banner ── */
    .result-banner {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
      border-radius: 12px; padding: 24px 28px; margin-bottom: 20px;
      text-align: center; color: #fff;
      box-shadow: 0 4px 16px rgba(27,58,107,0.2);
      position: relative; overflow: hidden;
    }
    .result-banner::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
    }
    .result-banner .banner-label {
      font-size: 0.8rem; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; opacity: 0.8; margin-bottom: 4px;
    }
    .result-banner h2 { font-size: 1.3rem; font-weight: 700; margin: 0; }

    /* ── Action bar ── */
    .action-bar {
      display: flex; gap: 10px;
      justify-content: flex-end; margin-bottom: 20px;
    }
    .icon-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: #fff; border: 1.5px solid var(--border);
      border-radius: 8px; padding: 8px 14px;
      font-family: 'Sarabun', sans-serif; font-size: 0.85rem;
      font-weight: 600; color: var(--navy); cursor: pointer; transition: all 0.2s;
    }
    .icon-btn:hover { background: var(--surface); border-color: var(--navy-light); }
    .icon-btn svg { width: 16px; height: 16px; }
    .icon-btn.copied { background: #E8F8F0; border-color: #1D9E75; color: #1D9E75; }

    /* ── Accordion card ── */
    .benefit-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; margin-bottom: 12px; overflow: hidden;
      box-shadow: 0 2px 8px rgba(27,58,107,0.07);
    }
    .benefit-card-header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
      padding: 16px 22px;
      display: flex; align-items: center; gap: 12px;
      cursor: pointer; user-select: none;
    }
    .benefit-card-header:hover { filter: brightness(1.08); }
    .benefit-index {
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(255,255,255,0.15); border: 1.5px solid rgba(200,168,75,0.6);
      color: var(--gold-light); font-size: 0.9rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .benefit-title { font-size: 1rem; font-weight: 700; color: #fff; margin: 0; flex: 1; }
    .benefit-toggle {
      width: 26px; height: 26px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.15); border-radius: 50%;
      color: #fff; font-size: 1.2rem; line-height: 1;
      transition: transform 0.3s ease;
    }
    .benefit-card.open .benefit-toggle { transform: rotate(45deg); }

    /* body accordion */
    .benefit-card-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 24px;
      max-height: 0;
      overflow: hidden;
      padding: 0 22px;
      transition: max-height 0.4s ease, padding 0.4s ease;
    }
    .benefit-card.open .benefit-card-body {
      max-height: 1200px;
      padding: 20px 22px;
    }

    .benefit-section-title {
      font-size: 0.73rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--navy);
      margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
    }
    .benefit-section-title::before {
      content: ''; width: 3px; height: 12px;
      background: var(--gold); border-radius: 2px; display: inline-block;
    }
    .benefit-detail { font-size: 0.9rem; color: var(--text-sub); line-height: 1.75; margin: 0; }
    .benefit-detail-full { grid-column: 1 / -1; }

    /* ── Checklist ✓ / ○ ── */
    .checklist-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .checklist-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .check-icon {
      width: 22px; height: 22px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px;
    }
    .check-icon svg { width: 14px; height: 14px; }

    /* ✓ matched — เขียว */
    .check-icon.matched {
      background: #E8F8F0;
      border: 1.5px solid #1D9E75;
      color: #1D9E75;
    }
    .matched-label {
      font-size: 0.9rem;
      color: var(--text-main);
      font-weight: 500;
      line-height: 1.5;
    }

    /* ○ missing — เทา */
    .check-icon.missing {
      background: #F4F6FA;
      border: 1.5px solid #C0C8D8;
      color: #8796AB;
    }
    .missing-label {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* note ใต้ checklist */
    .missing-note {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 8px;
      padding: 6px 10px;
      background: #F4F6FA;
      border-radius: 6px;
      border-left: 3px solid #C0C8D8;
    }

    /* ── Document list ── */
    .doc-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .doc-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      color: var(--text-sub);
    }
    .doc-row svg {
      width: 14px; height: 14px;
      color: var(--navy-light);
      flex-shrink: 0;
    }

    /* ── AI detail loading ── */
    .detail-loading {
      display: inline-block;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-style: italic;
    }
    .detail-loading::after {
      content: '...';
      animation: dots 1.2s infinite;
    }
    @keyframes dots {
      0%,20%  { content: '.'; }
      40%,60% { content: '..'; }
      80%,100%{ content: '...'; }
    }

    /* ── Highlight chips ── */
    .highlight-bar {
      display: flex; gap: 8px; flex-wrap: wrap;
      padding: 10px 22px 12px;
      background: rgba(0,0,0,0.15);
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .highlight-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 20px; padding: 4px 12px;
      font-size: 0.8rem; font-weight: 600; color: #fff;
      font-family: 'Sarabun', sans-serif;
    }
    .chip-icon { font-size: 0.9rem; line-height: 1; }

    /* ── hint / disclaimer / misc ── */
    .expand-hint {
      font-size: 0.78rem; color: var(--text-muted);
      text-align: right; margin-bottom: 8px;
    }
    .benefit-link {
      display: inline-block; color: var(--navy-light);
      text-decoration: underline; font-size: 0.88rem;
      font-weight: 600; font-family: 'Sarabun', sans-serif;
      transition: color 0.2s;
    }
    .benefit-link:hover { color: var(--navy); }
    .disclaimer {
      font-size: 0.82rem; color: var(--text-muted); margin-top: 24px;
      padding: 12px 16px; background: #fff; border: 1px solid var(--border);
      border-radius: 8px; border-left: 3px solid var(--gold);
    }
    .footer-actions { justify-content: center; }
    .no-result-box { text-align: center; padding: 48px 24px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; }
    .no-result-icon { width: 56px; height: 56px; background: #FFF4E5; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    .no-result-heading { font-size: 1.15rem; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
    .no-result-sub { font-size: 0.92rem; color: var(--text-sub); line-height: 1.7; }
    .header-logo { width: 36px; height: 36px; object-fit: contain; filter: brightness(0) invert(1); }

    /* ── RAG-first result view ── */
    .rag-hero { background: linear-gradient(135deg, #11264e, #245a9b); color: #fff; border-radius: 16px; padding: 30px; margin-bottom: 22px; box-shadow: 0 10px 26px rgba(27,58,107,.18); }
    .rag-kicker { color: #f3cf7a; letter-spacing: .14em; font-size: .72rem; font-weight: 700; margin-bottom: 8px; }
    .rag-hero h2 { font-size: 1.35rem; margin: 0 0 8px; }
    .rag-hero p { margin: 0; opacity: .84; line-height: 1.65; }
    .rag-loading { display: flex; gap: 7px; margin-top: 20px; }
    .rag-loading span { width: 8px; height: 8px; border-radius: 100%; background: #f3cf7a; animation: pulse 1.1s infinite; }
    .rag-loading span:nth-child(2) { animation-delay: .15s; }.rag-loading span:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse { 50% { opacity: .25; transform: translateY(-3px); } }
    .rag-results { display: grid; gap: 16px; }
    .rag-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 24px; box-shadow: 0 3px 12px rgba(27,58,107,.07); }
    .rag-card-top { display: flex; align-items: center; gap: 9px; color: var(--navy); font-size: .76rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }.rag-card-top span { color: #fff; background: var(--navy); border-radius: 50%; width: 27px; height: 27px; display: grid; place-items: center; }.rag-card-top p { margin: 0; }
    .rag-card h3 { margin: 13px 0 16px; color: var(--text-main); font-size: 1.16rem; }.rag-answer { background: #f2f6fc; border-left: 4px solid var(--gold); border-radius: 7px; padding: 15px 16px; }.rag-answer-label, .rag-card h4 { font-size: .72rem; color: var(--navy); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; margin: 0 0 7px; }.rag-answer p { color: var(--text-sub); white-space: pre-line; line-height: 1.75; margin: 0; }
    .rag-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 20px 0 12px; }.rag-grid ul { list-style: none; padding: 0; margin: 0; }.rag-grid li { color: var(--text-sub); font-size: .87rem; padding: 5px 0 5px 20px; position: relative; }.rag-match::before, .rag-missing::before { position: absolute; left: 0; font-weight: 700; }.rag-match::before { content: '✓'; color: #1D9E75; }.rag-missing::before { content: '?'; color: #d38d0b; }
    .rag-footer { border-top: 1px solid var(--border); padding-top: 13px; display: flex; justify-content: space-between; gap: 15px; color: var(--text-muted); font-size: .83rem; }.rag-footer a { color: var(--navy-light); font-weight: 700; white-space: nowrap; }

    @media print {
      .app-header, .footer-actions, .action-bar { display: none !important; }
      .benefit-card-body { max-height: none !important; padding: 20px 22px !important; }
      .content-area { padding: 0; max-width: 100%; }
      body { background: #fff; }
    }
    @media (max-width: 576px) {
      .benefit-card-body { grid-template-columns: 1fr; }
      .rag-grid { grid-template-columns: 1fr; gap: 15px; }.rag-card, .rag-hero { padding: 20px; }.rag-footer { flex-direction: column; }
      .content-area { padding: 24px 16px; }
      .action-bar { justify-content: center; flex-wrap: wrap; }
    }
  </style>
</head>
<body>

  <div class="app-header">
    <a href="input.html">
      <img src="logo.png" alt="Smart Rights Viewer" class="header-logo" />
    </a>
    <h1>ผลการตรวจสอบสิทธิ</h1>
    <div class="header-spacer"></div>
  </div>

  <div class="content-area">

    <div class="action-bar">
      <button class="icon-btn" onclick="window.print()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/>
        </svg>
        พิมพ์ / บันทึก PDF
      </button>
      <button class="icon-btn" id="copy-btn" onclick="copyResults()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
        </svg>
        คัดลอกผลลัพธ์
      </button>
    </div>

    <div id="result-content"></div>

    <p class="disclaimer">
      * หมายเหตุ: ผลที่แสดงเป็นการประเมินเบื้องต้นเท่านั้น
      กรุณาติดต่อหน่วยงานที่เกี่ยวข้องเพื่อยืนยันสิทธิอย่างเป็นทางการ
    </p>
  </div>

  <div class="footer-actions">
    <a class="btn-action primary" href="input.html">ตรวจสอบอีกครั้ง</a>
  </div>

  <script src="app.js"></script>
  <script>
    let currentBenefits = [];

    window.addEventListener("DOMContentLoaded", () => {
      const raw = sessionStorage.getItem("benefits");
      if (!raw) { window.location.href = "input.html"; return; }

      currentBenefits = JSON.parse(raw);
      renderResults(currentBenefits);

      if (currentBenefits.length > 0) {
        loadAIExplanation();
      }
    });

    function toggleCard(card) {
      card.classList.toggle("open");
    }

    function copyResults() {
      if (currentBenefits.length === 0) return;
      let text = `ผลการตรวจสอบสิทธิประโยชน์ภาครัฐ\nพบสิทธิทั้งหมด ${currentBenefits.length} รายการ\n${"=".repeat(40)}\n\n`;
      currentBenefits.forEach((b, i) => {
        text += `${i + 1}. ${b.name}\n`;
        text += `   เงื่อนไขที่ตรง: ${b.matched_conditions.join(", ")}\n`;
        text += `   เอกสาร: ${b.docs.join(", ")}\n`;
        text += `   ติดต่อ: ${b.contact.join(", ")}\n\n`;
      });
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById("copy-btn");
        const ori = btn.innerHTML;
        btn.classList.add("copied");
        btn.innerHTML = "✓ คัดลอกแล้ว";
        setTimeout(() => { btn.classList.remove("copied"); btn.innerHTML = ori; }, 2000);
      });
    }
  </script>
</body>
</html>
